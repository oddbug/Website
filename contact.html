<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact</title>
    <meta name="description" content="An angel's personal website where I do anything I want.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    
    <meta property="og:title" content="Nebula">
    <meta property="og:description" content="Contact me.">
    <!--<meta property="og:image" content="">-->
    <meta property="og:url" content="https://nogood-angel.moe/home.html">
    
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="style.css">
    <script src="layout.js"></script>
    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7/jquery.min.js"></script>
    <script src="scripts/jquery.style-my-tooltips.js"></script>
    <script>
        (function($){
            $(document).ready(function(){
                $("[title]").style_my_tooltips({ 
                    tip_follows_cursor:true,
                    tip_delay_time:0,
                    tip_fade_speed:0,
                    attribute:"title"
                });
            });
        })(jQuery);
    </script>
</head>
    
<body>
    <div class="container">
        <aside></aside>
        <main>
            <div class="middle">
                <h2>Would you like to contact me?</h2>
                <p>For serious inquiries only, email me at <b>nogoodangel@gmail.com</b>. Otherwise, use this contact form.</p>
                
                <form onsubmit="sendContact(event)">
                    <div class="mb-3">
                        <label for="emailInput" class="form-label">Enter your email address</label>
                        <input type="email" class="form-control" id="emailInput">
                    </div>
                    <div class="mb-3">
                        <label for="messageInput" class="form-label">Enter your message</label>
                        <textarea class="form-control" id="messageInput" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
                <script>
                    async function sendContact(ev) {
                        ev.preventDefault();

                        const senderEmail = document
                            .getElementById('emailInput').value;
                        const senderMessage = document
                            .getElementById('messageInput').value;
                    }
                    
                    const webhookBody = {
                        embeds: [{
                            title: 'Contact Form Submitted',
                            fields: [
                                { name: 'Sender', value: senderEmail },
                                { name: 'Message', value: senderMessage }
                            ]
                        }],
                    };
                    
                    const webhookUrl = 'https://discord.com/api/webhooks/1512405860918235209/fqsYT1_QJfHsjQt4djaAR6z7WGVua9-alsEaXS_lygSYtNyskTfpcC-CSCZfmmlvYC3z';
                    const response = await fetch(webhookUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(webhookBody),
                    });
                    
                    if (response.ok) {
                        alert('I have received your message!');
                    } else {
                        alert('There was an error! Try again later!');
                    }
                </script>
            </div>
        </main>
    </div>
</body>
</html>
